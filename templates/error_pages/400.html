{% extends 'layout.html' %} {% block content %}
<section id="error-page-section" class="error-page-section">
    <div class="error-page">
        <h2>400!</h2>
        <p>Bad Request!</p>
        {% if reason %}
        <small>{{ reason }}</small>
        {% else %}
        <small>Your session may be expired, please login to try again.</small>
        {% endif %}
        <a href="{{url_for('main.home')}}">Return to home page</a>
    </div>
</section>
{% endblock content %}
